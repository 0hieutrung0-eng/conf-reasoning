data:
  train_files: ${env:HOME}/data/medqa/train.parquet
  val_files: ${env:HOME}/data/medqa/test.parquet
  train_batch_size: 256
  val_batch_size: 1312
  max_prompt_length: 512
  max_response_length: 256

actor_rollout_ref:
  model:
    path: "Qwen/Qwen2.5-0.5B-Instruct"
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 4
  rollout:
    log_prob_micro_batch_size_per_gpu: 8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.4
  ref:
    log_prob_micro_batch_size_per_gpu: 4

critic:
  optim:
    lr: 1e-5
  model:
    path: "Qwen/Qwen2.5-0.5B-Instruct"
  ppo_micro_batch_size_per_gpu: 4

algorithm:
  kl_ctrl:
    kl_coef: 0.001

trainer:
  total_epochs: 15
  val_before_train: true

  logger: ["console", "wandb"]

  project_name: "verl"
  experiment_name: "medqa_0.5B_baseline"
  
  default_hdfs_dir: null
  n_gpus_per_node: 1
  nnodes: 1

  save_freq: 10
  test_freq: 10
  
